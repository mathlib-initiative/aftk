name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Diagnostics daemon tests
        run: ./tests/server.sh
      - name: Technical-debt tests
        run: ./tests/tech_debt.sh
